apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: usms-results-ingress
  namespace: usms
  labels:
    app: usms-results
    project: usms
    lab: "08"
  annotations:
    # Real EKS only (AWS Load Balancer Controller). Inert locally.
    # group.name joins the SAME ALB as usms-portal-ingress: one more rule, not a second load balancer.
    alb.ingress.kubernetes.io/group.name: usms-portal
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # Only the university network may reach it.
    alb.ingress.kubernetes.io/inbound-cidrs: 10.0.0.0/8
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  rules:
    - http:
        paths:
          - path: /results
            pathType: Prefix
            backend:
              service:
                name: usms-results
                port:
                  number: 80
